name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: graceland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Builds a signed .aab (Android App Bundle) for uploading to Google Play.
  # Only runs if the four signing secrets below are set in this repo
  # (Settings -> Secrets and variables -> Actions), so it's safe to leave in
  # place even before you've added them.
  build-release:
    runs-on: ubuntu-latest
    if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release bundle (.aab)
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: graceland-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
